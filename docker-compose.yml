# Продакшен на своём сервере (Oracle Cloud, VPS): приложение + PostgreSQL + Caddy (HTTPS от Let's Encrypt).
# Запуск: docker compose --env-file deploy/.env up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: zherkoz
      POSTGRES_USER: zherkoz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zherkoz -d zherkoz"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    env_file: deploy/.env
    environment:
      DATABASE_URL: postgresql+psycopg://zherkoz:${POSTGRES_PASSWORD}@db:5432/zherkoz
      PUBLIC_URL: https://${DOMAIN:?задайте DOMAIN в deploy/.env}
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  caddy_data:
  caddy_config:
