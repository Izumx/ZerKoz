# Render Blueprint: New → Blueprint → выбрать репозиторий. Создаст веб-сервис и PostgreSQL.
# Бот на Render работает через webhook (адрес сервиса Render подставляет сам в RENDER_EXTERNAL_URL),
# поэтому «засыпание» бесплатного сервиса не мешает: входящее сообщение будит его.
services:
  - type: web
    name: zherkoz
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: zherkoz-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: BOT_TOKEN
        sync: false # токен от @BotFather
      - key: INSPECTOR_PASSWORD
        sync: false # пароль входа в панель
      - key: SEED_ON_START
        value: "true"
      - key: DEMO_MODE
        value: "true"
      - key: ANTHROPIC_API_KEY
        sync: false # необязательно: ИИ-подсказки по фото
      - key: COPERNICUS_CLIENT_ID
        sync: false # необязательно: реальный NDVI Sentinel-2
      - key: COPERNICUS_CLIENT_SECRET
        sync: false

databases:
  - name: zherkoz-db
    plan: free
    databaseName: zherkoz
